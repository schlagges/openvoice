<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVoice</title>
    <style>
      :root {
        --bg: #0f1217;
        --surface: #171b22;
        --surface-2: #1f2530;
        --surface-3: #252d39;
        --panel: #141922;
        --panel-2: #1b2230;
        --stage: #151a23;
        --stage-2: #10141b;
        --subtle-surface: rgb(255 255 255 / 5%);
        --border: #2d3542;
        --border-light: #303948;
        --text: #eef4ff;
        --text-muted: #94a3b8;
        --text-dark: #e5edf8;
        --text-dark-muted: #94a3b8;
        --accent: #4f8cff;
        --accent-soft: #dbeafe;
        --success: #2fb87a;
        --danger: #ef4444;
        --danger-soft: #fee2e2;
        --warning: #f59e0b;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-focus: 0 0 0 3px rgb(79 140 255 / 35%);
        color: var(--text);
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body[data-theme="light"] {
        --bg: #eef2f7;
        --surface: #f8fafc;
        --surface-2: #eef2f7;
        --surface-3: #e2e8f0;
        --panel: #ffffff;
        --panel-2: #f1f5f9;
        --stage: #ffffff;
        --stage-2: #f8fafc;
        --subtle-surface: rgb(15 23 42 / 4%);
        --border: #d8dee8;
        --border-light: #d8dee8;
        --text: #111827;
        --text-muted: #64748b;
        --text-dark: #111827;
        --text-dark-muted: #64748b;
        --accent-soft: #dbeafe;
      }

      html,
      body,
      #app {
        height: 100%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        transition:
          background-color 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease,
          color 150ms ease,
          opacity 150ms ease,
          transform 150ms ease;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app-shell {
        background:
          radial-gradient(circle at top left, rgb(79 140 255 / 12%), transparent 26rem),
          linear-gradient(135deg, rgb(255 255 255 / 2%), transparent 28rem),
          var(--bg);
        display: grid;
        grid-template-columns: minmax(242px, 276px) minmax(0, 1fr) minmax(300px, 340px);
        height: 100dvh;
        overflow: hidden;
      }

      .channel-sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }

      .sidebar-header,
      .section-header,
      .workspace-topbar,
      .dialog-header {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        min-width: 0;
      }

      .sidebar-header h1 {
        font-size: 0.98rem;
        letter-spacing: 0.01em;
        margin: 0;
      }

      .sidebar-header__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: end;
      }

      .section-header__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: end;
      }

      .sidebar-header p,
      .section-header p,
      .dialog-header p {
        color: var(--text-muted);
        font-size: 0.73rem;
        line-height: 1.25;
        margin: 2px 0 0;
      }

      .section-header h2,
      .ops-links summary {
        color: var(--text);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        margin: 0;
        text-transform: uppercase;
      }

      .primary-action,
      .ghost-button,
      .icon-button {
        border-radius: var(--radius-sm);
        min-height: 32px;
        padding: 0 10px;
      }

      .primary-action {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #ffffff;
        font-weight: 800;
      }

      .primary-action.compact {
        font-size: 0.75rem;
        padding: 0 9px;
      }

      .ghost-button.compact {
        font-size: 0.78rem;
        min-height: 32px;
        padding: 0 9px;
      }

      .ghost-button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .primary-action:hover:not(:disabled),
      .ghost-button:hover:not(:disabled),
      .icon-button:hover:not(:disabled) {
        border-color: rgb(79 140 255 / 52%);
        box-shadow: 0 0 0 1px rgb(79 140 255 / 12%);
        transform: translateY(-1px);
      }

      .ghost-button:disabled {
        background: var(--subtle-surface);
        color: var(--text-muted);
        opacity: 0.45;
      }

      .icon-button {
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text);
        min-width: 32px;
        padding: 0;
      }

      .workspace-switcher,
      .channel-browser {
        display: grid;
        gap: 8px;
      }

      .workspace-switcher__list,
      .channel-tree__list,
      .participant-list,
      .voice-participant-grid,
      .chat-messages {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .workspace-switcher__list,
      .channel-tree__list {
        display: grid;
        gap: 6px;
      }

      .workspace-switcher__item,
      .channel-tree__label {
        align-items: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text);
        display: grid;
        min-height: 34px;
        text-align: left;
        width: 100%;
      }

      .workspace-switcher__item {
        gap: 2px;
        padding: 6px 8px;
      }

      .workspace-switcher__item:hover,
      .channel-tree__label:hover {
        background: var(--surface-2);
        border-color: var(--border);
      }

      .workspace-switcher__item.is-active,
      .channel-tree__item.is-active > .channel-tree__label {
        background: rgb(79 140 255 / 16%);
        border-color: rgb(79 140 255 / 45%);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .workspace-switcher__item small,
      .workspace-switcher__status,
      .workspace-switcher__empty,
      .sidebar-participants__empty {
        color: var(--text-muted);
        font-size: 0.72rem;
      }

      .hierarchy-label {
        color: var(--text-muted);
        font-size: 0.8rem;
        margin: 4px 0 0;
      }

      .workspace-empty {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .workspace-empty strong {
        color: var(--text);
      }

      .channel-tree__list--nested {
        margin-top: 6px;
        padding-left: 14px;
      }

      .channel-tree__label {
        grid-template-columns: 26px minmax(0, 1fr) auto auto;
        gap: 6px;
        padding: 5px 7px;
      }

      .channel-tree__label:disabled {
        color: var(--text-muted);
      }

      .channel-tree__icon {
        align-items: center;
        background: var(--surface-3);
        border-radius: 8px;
        color: var(--accent-soft);
        display: inline-flex;
        font-size: 0.74rem;
        font-weight: 900;
        height: 24px;
        justify-content: center;
      }

      .channel-tree__name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .channel-tree__badge,
      .channel-tree__count {
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text-muted);
        font-size: 0.6rem;
        font-weight: 800;
        padding: 1px 5px;
      }

      .channel-tree__empty,
      .sidebar-participants {
        background: var(--subtle-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 7px;
        padding: 9px;
      }

      .sidebar-participants h3 {
        font-size: 0.72rem;
        letter-spacing: 0.03em;
        margin: 0;
        text-transform: uppercase;
      }

      .participant-list {
        display: grid;
        gap: 5px;
      }

      .participant-list__item {
        align-items: center;
        display: grid;
        gap: 7px;
        grid-template-columns: 26px minmax(0, 1fr) auto;
      }

      .participant-avatar {
        align-items: center;
        background: linear-gradient(135deg, #4f8cff, #20c997);
        border-radius: 999px;
        color: white;
        display: inline-flex;
        font-size: 0.68rem;
        font-weight: 900;
        height: 28px;
        justify-content: center;
        width: 28px;
      }

      .participant-list__name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .participant-status-icons {
        color: var(--text-muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.58rem;
        gap: 3px;
        justify-content: end;
      }

      .participant-status-icons span {
        background: rgb(255 255 255 / 7%);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 4px;
      }

      .sidebar-footer {
        display: grid;
        gap: 8px;
        margin-top: auto;
      }

      .sidebar-logout {
        width: 100%;
      }

      .ops-links {
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }

      .ops-links summary {
        cursor: pointer;
      }

      .ops-links__grid {
        display: grid;
        gap: 5px;
        grid-template-columns: 1fr 1fr;
        margin-top: 8px;
      }

      .ops-links__grid a {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        font-size: 0.7rem;
        padding: 6px 7px;
        text-decoration: none;
      }

      .workspace-panel {
        display: grid;
        gap: 10px;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        padding: 12px;
      }

      .workspace-topbar {
        background: var(--subtle-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 9px 10px;
      }

      .workspace-topbar h2 {
        font-size: 1.05rem;
        line-height: 1.2;
        margin: 0;
      }

      .eyebrow {
        color: var(--text-muted);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        margin: 0 0 3px;
        text-transform: uppercase;
      }

      .desktop-qr {
        align-items: center;
        display: flex;
        gap: 7px;
      }

      .desktop-qr__code {
        background: white;
        border-radius: 7px;
        padding: 4px;
        width: 42px;
      }

      .desktop-qr__code svg {
        display: block;
        width: 100%;
      }

      .desktop-qr__link {
        color: var(--text-muted);
        font-size: 0.68rem;
        text-decoration: none;
      }

      .voice-panel {
        background:
          radial-gradient(circle at 50% 0%, rgb(79 140 255 / 14%), transparent 28rem),
          linear-gradient(180deg, var(--stage) 0%, var(--stage-2) 100%);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: grid;
        gap: 10px;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        min-height: 0;
        overflow: hidden;
        padding: 10px;
      }

      .voice-panel__header,
      .chat-panel__header {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        min-width: 0;
      }

      .voice-panel__header h2,
      .chat-panel__header h2 {
        font-size: 0.96rem;
        line-height: 1.2;
        margin: 0;
      }

      .voice-panel__status,
      .status-pill {
        background: rgb(79 140 255 / 12%);
        border: 1px solid rgb(79 140 255 / 26%);
        border-radius: 999px;
        color: var(--accent-soft);
        font-size: 0.7rem;
        font-weight: 800;
        padding: 4px 8px;
      }

      .voice-participant-stage {
        min-height: 0;
        overflow: auto;
      }

      .voice-stage-empty,
      .chat-empty {
        align-content: center;
        border: 1px dashed rgb(148 163 184 / 30%);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 6px;
        justify-items: center;
        min-height: 160px;
        padding: 16px;
        text-align: center;
      }

      .voice-stage-empty strong,
      .chat-empty strong {
        color: var(--text);
      }

      .voice-stage-empty__icon {
        align-items: center;
        background: rgb(79 140 255 / 18%);
        border-radius: 999px;
        color: var(--accent-soft);
        display: inline-flex;
        font-size: 1.18rem;
        height: 44px;
        justify-content: center;
        width: 44px;
      }

      .voice-participant-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      }

      .voice-participant-card {
        align-content: center;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: grid;
        gap: 5px;
        justify-items: center;
        min-height: 120px;
        padding: 10px;
        text-align: center;
      }

      .voice-participant-card .participant-avatar {
        box-shadow: 0 8px 24px rgb(0 0 0 / 22%);
        font-size: 0.9rem;
        height: 44px;
        width: 44px;
      }

      .voice-participant-card.is-speaking {
        border-color: var(--success);
        box-shadow:
          0 0 0 2px rgb(47 184 122 / 18%),
          0 0 28px rgb(47 184 122 / 10%);
      }

      .voice-video-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        min-height: 0;
      }

      .voice-video-grid:empty {
        display: none;
      }

      .voice-video-grid__tile {
        aspect-ratio: 16 / 9;
        background: #05070a;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: #ffffff;
        min-width: 0;
        overflow: hidden;
        padding: 0;
        position: relative;
      }

      .voice-video-grid__tile.is-focused {
        grid-column: 1 / -1;
      }

      .voice-video-grid__tile video {
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .voice-video-grid__caption {
        background: rgb(5 7 10 / 76%);
        border-radius: 999px;
        bottom: 10px;
        font-size: 0.72rem;
        font-weight: 800;
        left: 10px;
        padding: 3px 8px;
        position: absolute;
      }

      .voice-panel__actions {
        align-items: center;
        background: var(--subtle-surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        justify-self: center;
        padding: 5px;
      }

      .voice-control-button,
      .voice-panel__settings summary {
        align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        display: inline-flex;
        font-size: 0.84rem;
        font-weight: 900;
        height: 36px;
        justify-content: center;
        min-width: 36px;
        padding: 0 10px;
      }

      .voice-control-button:hover,
      .voice-panel__settings summary:hover {
        background: var(--surface-3);
        border-color: rgb(79 140 255 / 48%);
        color: var(--text);
      }

      .voice-control-button.is-active {
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 18px rgb(79 140 255 / 22%);
        color: #ffffff;
      }

      .voice-control-button:disabled {
        opacity: 0.48;
      }

      .voice-control-icon {
        fill: none;
        height: 16px;
        pointer-events: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
        width: 16px;
      }

      .voice-control-button--danger {
        background: var(--danger);
        border-color: var(--danger);
        box-shadow: 0 0 18px rgb(239 68 68 / 18%);
        color: #ffffff;
      }

      .voice-panel__settings {
        position: relative;
      }

      .voice-panel__media {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        bottom: 44px;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(130px, 1fr));
        padding: 10px;
        position: absolute;
        right: 0;
        width: min(560px, calc(100vw - 48px));
        z-index: 5;
      }

      .voice-panel__field {
        color: var(--text-muted);
        display: grid;
        font-size: 0.7rem;
        font-weight: 800;
        gap: 5px;
      }

      .voice-panel__input {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        min-height: 34px;
        padding: 0 9px;
      }

      .chat-column {
        background: var(--panel);
        border-left: 1px solid var(--border-light);
        color: var(--text-dark);
        min-height: 0;
        overflow: hidden;
        padding: 10px;
      }

      .chat-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        height: 100%;
        min-height: 0;
      }

      .chat-panel__header {
        border-bottom: 1px solid var(--border-light);
        padding-bottom: 8px;
      }

      .chat-panel .eyebrow,
      .chat-panel .status-pill {
        color: var(--text-dark-muted);
      }

      .chat-panel .status-pill {
        background: var(--panel-2);
        border-color: var(--border-light);
      }

      .chat-messages {
        display: grid;
        align-content: start;
        gap: 8px;
        min-height: 0;
        overflow: auto;
        padding: 10px 1px;
      }

      .chat-message {
        align-items: end;
        display: grid;
        gap: 7px;
        grid-template-columns: 26px minmax(0, 1fr);
        max-width: 94%;
      }

      .chat-message:hover {
        background: transparent;
      }

      .chat-message--own {
        grid-template-columns: minmax(0, 1fr) 26px;
        justify-self: end;
      }

      .chat-message--own .chat-message__avatar {
        grid-column: 2;
      }

      .chat-message--own .chat-message__bubble {
        background: color-mix(in srgb, var(--accent) 24%, var(--panel));
        border-color: color-mix(in srgb, var(--accent) 44%, var(--border-light));
        grid-column: 1;
        grid-row: 1;
      }

      .chat-message__avatar {
        align-items: center;
        background: var(--surface-3);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        color: var(--text);
        display: inline-flex;
        font-size: 0.66rem;
        font-weight: 900;
        height: 26px;
        justify-content: center;
        width: 26px;
      }

      .chat-message__bubble {
        background: var(--panel-2);
        border: 1px solid var(--border-light);
        border-radius: 14px 14px 14px 5px;
        padding: 7px 9px;
      }

      .chat-message--own .chat-message__bubble {
        border-radius: 14px 14px 5px;
      }

      .chat-message__meta {
        color: var(--text-dark-muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.65rem;
        gap: 5px;
      }

      .chat-message__author {
        color: var(--text-dark);
        font-weight: 800;
      }

      .chat-message__body {
        font-size: 0.84rem;
        line-height: 1.3;
        margin: 2px 0 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .chat-empty {
        color: var(--text-dark-muted);
        min-height: 180px;
      }

      .chat-empty strong {
        color: var(--text-dark);
      }

      .chat-composer {
        background: transparent;
        border-top: 1px solid var(--border-light);
        display: grid;
        gap: 5px;
        padding: 8px 0 0;
      }

      .chat-composer__label {
        height: 1px;
        margin: -1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      .chat-composer__field {
        position: relative;
      }

      .chat-composer__input {
        background: var(--panel);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        color: var(--text-dark);
        min-height: 34px;
        padding: 7px 46px 7px 12px;
        resize: none;
        width: 100%;
      }

      .chat-composer__status,
      .form-status {
        color: var(--text-dark-muted);
        font-size: 0.7rem;
        margin: 0;
        min-height: 12px;
      }

      .chat-composer__send {
        align-items: center;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        color: white;
        display: inline-flex;
        font-weight: 900;
        height: 28px;
        justify-content: center;
        position: absolute;
        right: 3px;
        top: 3px;
        width: 34px;
      }

      .audit-log {
        background: var(--subtle-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 6px;
        max-height: 132px;
        overflow: auto;
        padding: 8px 10px;
      }

      .audit-log h2 {
        color: var(--text-muted);
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        margin: 0;
        text-transform: uppercase;
      }

      .audit-log__empty {
        font-size: 0.72rem;
        margin: 0;
      }

      .audit-log__list {
        display: grid;
        gap: 6px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .audit-log__entry {
        border-top: 1px solid var(--border);
        display: grid;
        gap: 2px;
        padding-top: 6px;
      }

      .audit-log__line,
      .audit-log__meta {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .audit-log__line {
        color: var(--text);
        font-size: 0.72rem;
      }

      .audit-log__line code {
        color: var(--text-muted);
        font-size: 0.66rem;
      }

      .audit-log__meta {
        font-size: 0.66rem;
      }

      dialog {
        background: var(--panel);
        border: 1px solid var(--border-light);
        border-radius: 14px;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
        color: var(--text-dark);
        max-width: min(720px, calc(100vw - 32px));
        padding: 18px;
        width: 100%;
      }

      dialog:not([open]) {
        display: none;
      }

      dialog::backdrop {
        background: rgb(0 0 0 / 55%);
      }

      dialog .eyebrow,
      dialog .dialog-header p {
        color: var(--text-dark-muted);
      }

      dialog h2 {
        margin: 0;
      }

      .onboarding-tabs {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
        margin: 14px 0;
      }

      .onboarding-tab {
        background: var(--panel-2);
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        color: var(--text-dark);
        display: grid;
        gap: 4px;
        padding: 11px;
        text-align: left;
      }

      .onboarding-tab.is-active {
        background: rgb(79 140 255 / 18%);
        border-color: rgb(79 140 255 / 62%);
        box-shadow: inset 3px 0 0 var(--accent);
        color: var(--text-dark);
      }

      body[data-theme="light"] .onboarding-tab.is-active {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .onboarding-tab span {
        color: var(--text-dark-muted);
        font-size: 0.74rem;
      }

      .onboarding-form,
      .invite-result {
        display: grid;
        gap: 9px;
      }

      .onboarding-form label,
      .invite-result label,
      .advanced-test-data label {
        display: grid;
        gap: 6px;
      }

      .onboarding-form label span,
      .invite-result label span,
      .advanced-test-data label span {
        color: var(--text-dark-muted);
        font-size: 0.72rem;
        font-weight: 800;
      }

      .onboarding-form input,
      .onboarding-form select,
      .invite-result input {
        background: var(--panel);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-sm);
        color: var(--text-dark);
        min-height: 36px;
        padding: 0 10px;
      }

      .advanced-test-data {
        background: var(--panel-2);
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        padding: 8px;
      }

      .advanced-test-data summary {
        color: var(--text-dark-muted);
        cursor: pointer;
        font-size: 0.76rem;
        font-weight: 800;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        box-shadow: var(--shadow-focus);
        outline: none;
      }

      [data-state="error"] {
        color: var(--danger);
      }

      [data-state="success"] {
        color: var(--success);
      }

      @media (max-width: 1100px) {
        .app-shell {
          grid-template-columns: minmax(222px, 260px) minmax(0, 1fr);
        }

        .chat-column {
          border-left: 0;
          border-top: 1px solid var(--border-light);
          grid-column: 2;
          max-height: 34dvh;
        }
      }

      @media (max-width: 760px) {
        body {
          overflow: auto;
        }

        .app-shell {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100dvh;
        }

        .channel-sidebar,
        .workspace-panel,
        .chat-column {
          max-height: none;
        }

        .chat-column {
          grid-column: 1;
        }

        .voice-panel__actions {
          bottom: 6px;
          position: sticky;
        }

        .onboarding-tabs,
        .voice-panel__media {
          grid-template-columns: 1fr;
        }

        .desktop-qr {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
