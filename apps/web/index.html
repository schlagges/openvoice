<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVoice</title>
    <style>
      :root {
        color: #151513;
        background: #f7f7f2;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(240px, 300px) 1fr;
        min-height: 100vh;
      }

      .channel-sidebar {
        border-right: 1px solid #d8d8ce;
        background: #ffffff;
        padding: 16px;
      }

      .channel-sidebar h1 {
        font-size: 1rem;
        font-weight: 700;
        margin: 0 0 16px;
      }

      .channel-tree__list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .channel-tree__list--nested {
        margin-top: 4px;
        padding-left: 16px;
      }

      .channel-tree__item {
        margin: 3px 0;
      }

      .channel-tree__label {
        align-items: center;
        border-radius: 6px;
        display: flex;
        gap: 8px;
        min-height: 32px;
        padding: 0 8px;
      }

      .channel-tree__kind {
        color: #577067;
        font-size: 0.7rem;
        font-weight: 700;
        min-width: 56px;
      }

      .channel-tree__empty {
        color: #5d5d55;
        margin: 0;
      }

      .workspace-panel {
        background: #f7f7f2;
        min-width: 0;
      }

      .chat-panel {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100vh;
      }

      .chat-messages {
        list-style: none;
        margin: 0;
        min-height: 0;
        overflow: auto;
        padding: 16px 20px;
      }

      .chat-message {
        border-bottom: 1px solid #e2e2d8;
        padding: 10px 0;
      }

      .chat-message__meta {
        align-items: center;
        color: #5d5d55;
        display: flex;
        flex-wrap: wrap;
        font-size: 0.8rem;
        gap: 8px;
      }

      .chat-message__author {
        color: #151513;
        font-weight: 700;
      }

      .chat-message__body {
        margin: 6px 0 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .chat-message__edited {
        color: #77776d;
      }

      .chat-composer {
        border-top: 1px solid #d8d8ce;
        display: grid;
        gap: 8px;
        padding: 12px 16px 16px;
      }

      .chat-composer__label {
        font-size: 0.8rem;
        font-weight: 700;
      }

      .chat-composer__input {
        border: 1px solid #c9c9bd;
        border-radius: 6px;
        font: inherit;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
      }

      .chat-composer__send {
        align-self: end;
        background: #246b5a;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        justify-self: end;
        min-height: 36px;
        padding: 0 14px;
      }

      .voice-panel {
        border-top: 1px solid #d8d8ce;
        display: grid;
        gap: 10px;
        padding: 14px 16px 18px;
      }

      .voice-panel__field {
        display: grid;
        gap: 6px;
      }

      .voice-panel__field span {
        color: #5d5d55;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .voice-panel__input {
        border: 1px solid #c9c9bd;
        border-radius: 6px;
        font: inherit;
        min-height: 34px;
        padding: 0 10px;
      }

      .voice-panel__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .voice-panel__actions button {
        background: #ffffff;
        border: 1px solid #c9c9bd;
        border-radius: 6px;
        color: #151513;
        font: inherit;
        min-height: 34px;
        padding: 0 12px;
      }

      .voice-panel__status {
        color: #5d5d55;
        font-size: 0.85rem;
        min-height: 20px;
      }

      @media (max-width: 720px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .channel-sidebar {
          border-right: 0;
          border-bottom: 1px solid #d8d8ce;
        }

        .chat-panel {
          min-height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
