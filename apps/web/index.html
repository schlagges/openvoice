<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVoice</title>
    <style>
      :root {
        --bg: #0b0f14;
        --surface: #10161f;
        --surface-2: #151d28;
        --surface-3: #1c2633;
        --panel: #111821;
        --panel-2: #17202b;
        --stage: #101820;
        --stage-2: #0c1118;
        --subtle-surface: rgb(255 255 255 / 5%);
        --border: #243142;
        --border-light: #29384a;
        --text: #f2f7ff;
        --text-muted: #93a4b9;
        --text-dark: #e5edf8;
        --text-dark-muted: #94a3b8;
        --accent: #5b8cff;
        --accent-soft: #dbeafe;
        --success: #2fb87a;
        --danger: #ef4444;
        --danger-soft: #fee2e2;
        --warning: #f59e0b;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-focus: 0 0 0 3px rgb(79 140 255 / 35%);
        color: var(--text);
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body[data-theme="light"] {
        --bg: #eef2f7;
        --surface: #f8fafc;
        --surface-2: #eef2f7;
        --surface-3: #e2e8f0;
        --panel: #ffffff;
        --panel-2: #f1f5f9;
        --stage: #ffffff;
        --stage-2: #f8fafc;
        --subtle-surface: rgb(15 23 42 / 4%);
        --border: #d8dee8;
        --border-light: #d8dee8;
        --text: #111827;
        --text-muted: #64748b;
        --text-dark: #111827;
        --text-dark-muted: #64748b;
        --accent-soft: #dbeafe;
      }

      html,
      body,
      #app {
        height: 100%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        transition:
          background-color 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease,
          color 150ms ease,
          opacity 150ms ease,
          transform 150ms ease;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app-shell {
        --density-gap: 8px;
        --density-padding: 10px;
        --tile-min: 132px;
        --tile-media-min: 190px;
        --ui-multiplier: 1;
        background:
          radial-gradient(circle at 18% 0%, rgb(91 140 255 / 12%), transparent 28rem),
          radial-gradient(circle at 72% 10%, rgb(47 184 122 / 7%), transparent 24rem), var(--bg);
        display: grid;
        grid-template-columns: minmax(252px, 284px) minmax(0, 1fr) minmax(292px, 328px);
        height: 100dvh;
        overflow: hidden;
      }

      .app-shell[data-ui-scale="0.8"] {
        --ui-multiplier: 0.88;
      }

      .app-shell[data-ui-scale="1.2"] {
        --ui-multiplier: 1.08;
      }

      .app-shell[data-ui-scale="1.5"] {
        --ui-multiplier: 1.22;
      }

      .app-shell[data-compactness="dense"] {
        --density-gap: 5px;
        --density-padding: 7px;
      }

      .app-shell[data-compactness="relaxed"] {
        --density-gap: 12px;
        --density-padding: 14px;
      }

      .app-shell[data-tile-size="small"] {
        --tile-min: 104px;
        --tile-media-min: 150px;
      }

      .app-shell[data-tile-size="medium"] {
        --tile-min: 148px;
        --tile-media-min: 210px;
      }

      .app-shell[data-tile-size="large"] {
        --tile-min: 190px;
        --tile-media-min: 280px;
      }

      .app-shell[data-layout-mode="compact"] {
        grid-template-columns: minmax(270px, 310px) minmax(0, 1fr);
      }

      .app-shell[data-layout-mode="compact"] .chat-column {
        border-left: 0;
        bottom: 12px;
        box-shadow: 0 18px 60px rgb(0 0 0 / 36%);
        max-height: min(520px, calc(100dvh - 24px));
        position: fixed;
        right: 12px;
        top: auto;
        width: min(360px, calc(100vw - 40px));
        z-index: 8;
      }

      .app-shell[data-layout-mode="compact"][data-chat-visibility="hidden"] .chat-column {
        display: none;
      }

      .app-shell[data-layout-mode="compact"][data-chat-visibility="docked"] {
        grid-template-columns: minmax(270px, 310px) minmax(0, 1fr) minmax(300px, 340px);
      }

      .app-shell[data-layout-mode="compact"][data-chat-visibility="docked"] .chat-column {
        border-left: 1px solid var(--border-light);
        box-shadow: none;
        max-height: none;
        position: static;
        width: auto;
      }

      .app-shell[data-layout-mode="meeting"][data-channel-visibility="overlay"] {
        grid-template-columns: minmax(0, 1fr);
      }

      .app-shell[data-layout-mode="meeting"][data-channel-visibility="overlay"][data-chat-visibility="docked"] {
        grid-template-columns: minmax(0, 1fr) minmax(292px, 340px);
      }

      .app-shell[data-layout-mode="meeting"][data-channel-visibility="docked"][data-chat-visibility="hidden"] {
        grid-template-columns: minmax(252px, 284px) minmax(0, 1fr);
      }

      .app-shell[data-channel-visibility="hidden"] {
        grid-template-columns: minmax(0, 1fr) minmax(292px, 328px);
      }

      .app-shell[data-channel-visibility="hidden"][data-chat-visibility="hidden"] {
        grid-template-columns: minmax(0, 1fr);
      }

      .app-shell[data-channel-visibility="hidden"] .channel-sidebar {
        display: none;
      }

      .app-shell[data-layout-mode="meeting"][data-channel-visibility="overlay"] .channel-sidebar {
        box-shadow: 0 24px 80px rgb(0 0 0 / 34%);
        left: 12px;
        max-height: calc(100dvh - 24px);
        position: fixed;
        top: 12px;
        transform: translateX(calc(-100% + 42px));
        transition: transform 180ms ease;
        width: min(292px, calc(100vw - 32px));
        z-index: 10;
      }

      .app-shell[data-layout-mode="meeting"][data-channel-visibility="overlay"]
        .channel-sidebar:hover,
      .app-shell[data-layout-mode="meeting"][data-channel-visibility="overlay"]
        .channel-sidebar:focus-within {
        transform: translateX(0);
      }

      .app-shell[data-layout-mode="meeting"][data-chat-visibility="hidden"] .chat-column {
        display: none;
      }

      .app-shell[data-layout-mode="meeting"][data-chat-visibility="overlay"] .chat-column {
        bottom: 12px;
        box-shadow: 0 18px 60px rgb(0 0 0 / 36%);
        max-height: min(520px, calc(100dvh - 24px));
        position: fixed;
        right: 12px;
        width: min(360px, calc(100vw - 40px));
        z-index: 9;
      }

      .app-shell[data-stage-mode="fullscreen"] {
        grid-template-columns: minmax(0, 1fr);
      }

      .app-shell[data-stage-mode="fullscreen"] .channel-sidebar,
      .app-shell[data-stage-mode="fullscreen"] .chat-column,
      .app-shell[data-stage-mode="fullscreen"] .workspace-topbar,
      .app-shell[data-stage-mode="fullscreen"] .audit-log {
        display: none;
      }

      .app-shell[data-stage-mode="fullscreen"] .workspace-panel {
        padding: 0;
      }

      .channel-sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: var(--density-gap);
        min-height: 0;
        overflow: auto;
        padding: var(--density-padding);
      }

      .sidebar-header,
      .section-header,
      .workspace-topbar,
      .dialog-header {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        min-width: 0;
      }

      .sidebar-header h1 {
        font-size: 0.92rem;
        letter-spacing: 0.01em;
        margin: 0;
      }

      .sidebar-logo {
        align-items: center;
        background: linear-gradient(135deg, var(--accent), var(--success));
        border-radius: 10px;
        box-shadow: 0 10px 30px rgb(91 140 255 / 18%);
        color: white;
        display: inline-flex;
        flex: 0 0 auto;
        font-size: 0.68rem;
        font-weight: 950;
        height: 34px;
        justify-content: center;
        width: 34px;
      }

      .sidebar-header__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: end;
      }

      .section-header__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: end;
      }

      .sidebar-header p,
      .section-header p,
      .dialog-header p {
        color: var(--text-muted);
        font-size: 0.68rem;
        line-height: 1.25;
        margin: 2px 0 0;
      }

      .section-header h2,
      .ops-links summary {
        color: var(--text);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.055em;
        margin: 0;
        text-transform: uppercase;
      }

      .primary-action,
      .ghost-button,
      .icon-button,
      .danger-button {
        border-radius: var(--radius-sm);
        min-height: 30px;
        padding: 0 9px;
      }

      .primary-action {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #ffffff;
        font-weight: 800;
      }

      .primary-action--keycloak {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        border-color: #22c55e;
        box-shadow:
          0 0 0 1px rgb(34 197 94 / 18%),
          0 12px 28px rgb(34 197 94 / 16%);
        color: #ffffff;
        width: 100%;
      }

      .primary-action.compact {
        font-size: 0.75rem;
        padding: 0 9px;
      }

      .ghost-button.compact {
        font-size: 0.72rem;
        min-height: 28px;
        padding: 0 8px;
      }

      .ghost-button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.72rem;
        font-weight: 700;
      }

      .danger-button {
        background: linear-gradient(135deg, #ef4444, #b91c1c);
        border: 1px solid rgb(239 68 68 / 70%);
        color: #ffffff;
        font-size: 0.72rem;
        font-weight: 900;
      }

      .primary-action:hover:not(:disabled),
      .ghost-button:hover:not(:disabled),
      .icon-button:hover:not(:disabled),
      .danger-button:hover:not(:disabled) {
        border-color: rgb(79 140 255 / 52%);
        box-shadow: 0 0 0 1px rgb(79 140 255 / 12%);
        transform: translateY(-1px);
      }

      .danger-button:hover:not(:disabled) {
        border-color: rgb(248 113 113 / 75%);
        box-shadow: 0 0 0 1px rgb(248 113 113 / 16%);
      }

      .ghost-button:disabled {
        background: var(--subtle-surface);
        color: var(--text-muted);
        opacity: 0.45;
      }

      .icon-button {
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text);
        min-width: 32px;
        padding: 0;
      }

      .workspace-switcher,
      .channel-browser {
        display: grid;
        gap: 7px;
      }

      .workspace-switcher__list,
      .channel-tree__list,
      .participant-list,
      .voice-participant-grid,
      .chat-messages {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .workspace-switcher__list,
      .channel-tree__list {
        display: grid;
        gap: 4px;
      }

      .workspace-switcher__item,
      .channel-tree__label {
        align-items: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text);
        display: grid;
        min-height: 32px;
        text-align: left;
        width: 100%;
      }

      .workspace-switcher__item {
        gap: 8px;
        grid-template-columns: 28px minmax(0, 1fr);
        padding: 6px 7px;
      }

      .workspace-switcher__item:hover,
      .channel-tree__label:hover {
        background: var(--surface-2);
        border-color: var(--border);
      }

      .workspace-switcher__item.is-active,
      .channel-tree__item.is-active > .channel-tree__label {
        background: linear-gradient(90deg, rgb(91 140 255 / 18%), rgb(91 140 255 / 7%));
        border-color: rgb(91 140 255 / 45%);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .workspace-switcher__item--global {
        background: linear-gradient(90deg, rgb(47 184 122 / 12%), rgb(47 184 122 / 5%));
        border-color: rgb(47 184 122 / 18%);
      }

      .workspace-switcher__item--global .workspace-switcher__avatar {
        background: rgb(47 184 122 / 18%);
        border-color: rgb(47 184 122 / 24%);
        color: #b7f7d8;
      }

      .workspace-switcher__item--private {
        background: rgb(255 255 255 / 2%);
      }

      .workspace-switcher__avatar {
        align-items: center;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        display: inline-flex;
        font-size: 0.66rem;
        font-weight: 950;
        height: 28px;
        justify-content: center;
        width: 28px;
      }

      .workspace-switcher__content {
        display: grid;
        gap: 1px;
        min-width: 0;
      }

      .workspace-switcher__name {
        font-size: 0.82rem;
        font-weight: 850;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .workspace-switcher__item small,
      .workspace-switcher__status,
      .workspace-switcher__empty,
      .sidebar-participants__empty {
        color: var(--text-muted);
        font-size: 0.68rem;
      }

      .hierarchy-label {
        color: var(--text-muted);
        font-size: 0.66rem;
        margin: 2px 0 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .workspace-empty {
        background: linear-gradient(180deg, var(--surface-2), rgb(255 255 255 / 3%));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 7px;
        padding: 9px;
      }

      .workspace-empty strong {
        color: var(--text);
      }

      .channel-tree__list--nested {
        margin-top: 4px;
        padding-left: 11px;
      }

      .channel-tree__label {
        grid-template-columns: 26px minmax(0, 1fr) auto;
        gap: 6px;
        padding: 5px 6px;
      }

      .channel-tree__label:disabled {
        color: var(--text-muted);
      }

      .channel-tree__icon {
        align-items: center;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--accent-soft);
        display: inline-flex;
        font-size: 0.66rem;
        font-weight: 900;
        height: 24px;
        justify-content: center;
      }

      .channel-tree__content {
        align-items: center;
        display: flex;
        gap: 6px;
        min-width: 0;
      }

      .channel-tree__name {
        font-size: 0.8rem;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .channel-tree__badge,
      .channel-tree__count {
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text-muted);
        font-size: 0.56rem;
        font-weight: 800;
        line-height: 1;
        padding: 3px 5px;
      }

      .channel-tree__empty,
      .sidebar-participants {
        background: var(--subtle-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 6px;
        padding: 8px;
      }

      .sidebar-participants h3 {
        font-size: 0.72rem;
        letter-spacing: 0.03em;
        margin: 0;
        text-transform: uppercase;
      }

      .participant-list {
        display: grid;
        gap: 5px;
      }

      .participant-list__item {
        align-items: center;
        display: grid;
        gap: 6px;
        grid-template-columns: 26px minmax(0, 1fr) auto;
      }

      .participant-avatar {
        align-items: center;
        background: linear-gradient(135deg, #4f8cff, #20c997);
        border-radius: 999px;
        color: white;
        display: inline-flex;
        font-size: 0.68rem;
        font-weight: 900;
        height: 26px;
        justify-content: center;
        width: 26px;
      }

      .participant-list__name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .participant-status-icons {
        color: var(--text-muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.58rem;
        gap: 3px;
        justify-content: end;
      }

      .participant-status-icons span {
        background: rgb(255 255 255 / 7%);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 4px;
      }

      .sidebar-footer {
        display: grid;
        gap: 8px;
        margin-top: auto;
      }

      .topbar-logout {
        min-height: 38px;
        min-width: 96px;
        padding-inline: 16px;
      }

      .topbar-logout:disabled {
        background: var(--surface-2);
        border-color: var(--border);
        color: var(--text-muted);
        opacity: 0.55;
      }

      .sidebar-share {
        align-items: center;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
        justify-content: space-between;
        padding-top: 10px;
      }

      .ops-links {
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }

      .ops-links summary {
        cursor: pointer;
      }

      .ops-links__grid {
        display: grid;
        gap: 5px;
        grid-template-columns: 1fr 1fr;
        margin-top: 8px;
      }

      .ops-links__grid a {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        font-size: 0.7rem;
        padding: 6px 7px;
        text-decoration: none;
      }

      .workspace-panel {
        display: grid;
        gap: var(--density-gap);
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        padding: var(--density-padding);
      }

      .workspace-topbar {
        align-items: center;
        backdrop-filter: blur(18px);
        background:
          linear-gradient(180deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 4%)), rgb(16 22 31 / 78%);
        border: 1px solid rgb(255 255 255 / 9%);
        border-radius: 16px;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 10%),
          0 18px 50px rgb(0 0 0 / 18%);
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(190px, 0.78fr) minmax(360px, 1.5fr) auto;
        min-height: 68px;
        padding: 8px 10px;
      }

      .topbar-context {
        align-items: center;
        display: grid;
        gap: 9px;
        grid-template-columns: 40px minmax(0, 1fr);
        min-width: 0;
      }

      .topbar-room-avatar {
        align-items: center;
        background:
          radial-gradient(circle at 38% 32%, rgb(255 255 255 / 28%), transparent 28%),
          linear-gradient(135deg, var(--accent), #20c997);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 12px;
        box-shadow: 0 12px 30px rgb(91 140 255 / 18%);
        color: #ffffff;
        display: inline-flex;
        font-size: 1rem;
        height: 40px;
        justify-content: center;
        width: 40px;
      }

      .topbar-center {
        align-items: center;
        display: flex;
        justify-content: center;
        min-width: 0;
      }

      .topbar-actions {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: end;
      }

      .topbar-participant-count {
        align-items: center;
        background: rgb(47 184 122 / 13%);
        border: 1px solid rgb(47 184 122 / 26%);
        border-radius: 999px;
        color: #b7f7d8;
        display: inline-flex;
        font-size: 0.82rem;
        font-weight: 900;
        height: 36px;
        justify-content: center;
        min-width: 36px;
      }

      .mode-controls {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        min-width: 0;
      }

      .mode-segment {
        background:
          linear-gradient(180deg, rgb(255 255 255 / 7%), rgb(255 255 255 / 3%)), rgb(12 17 24 / 62%);
        border: 1px solid rgb(255 255 255 / 8%);
        border-radius: 999px;
        display: inline-flex;
        gap: 2px;
        padding: 4px;
      }

      .mode-segment--subtle {
        background: rgb(255 255 255 / 4%);
      }

      .mode-button {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 999px;
        color: var(--text-muted);
        display: inline-flex;
        font-size: calc(0.72rem * var(--ui-multiplier));
        font-weight: 850;
        gap: 6px;
        min-height: calc(34px * var(--ui-multiplier));
        padding: 0 11px;
      }

      .mode-button.is-active {
        background: linear-gradient(180deg, rgb(255 255 255 / 15%), transparent), var(--accent);
        color: #ffffff;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 18%),
          0 0 18px rgb(91 140 255 / 22%);
      }

      .mode-button--icon {
        font-size: calc(0.84rem * var(--ui-multiplier));
        min-width: 32px;
        padding: 0 9px;
      }

      .mode-button__icon {
        display: inline-block;
        font-size: calc(1.08rem * var(--ui-multiplier));
        font-weight: 900;
        line-height: 1;
      }

      .mode-button--toggle {
        min-width: calc(108px * var(--ui-multiplier));
      }

      .mode-segment--sidebars .mode-button:not(.is-active) {
        background: rgb(255 255 255 / 4%);
        color: var(--text-muted);
      }

      .mode-combo {
        align-items: center;
        display: inline-flex;
        gap: 5px;
      }

      .mode-combo > span {
        color: var(--text-muted);
        font-size: 0.57rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .mode-field {
        align-items: center;
        color: var(--text-muted);
        display: inline-flex;
        font-size: 0.64rem;
        font-weight: 800;
        gap: 5px;
      }

      .mode-field select {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        font-size: 0.66rem;
        min-height: 26px;
        padding: 0 7px;
      }

      .mode-settings {
        position: relative;
      }

      .mode-settings summary {
        align-items: center;
        background: rgb(255 255 255 / 6%);
        border: 1px solid rgb(255 255 255 / 9%);
        border-radius: 999px;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        font-size: 0.95rem;
        height: 32px;
        justify-content: center;
        list-style: none;
        width: 32px;
      }

      .mode-settings summary::-webkit-details-marker {
        display: none;
      }

      .mode-settings__panel {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 18px 60px rgb(0 0 0 / 34%);
        display: grid;
        gap: 8px;
        padding: 10px;
        position: absolute;
        right: 0;
        top: 34px;
        width: 220px;
        z-index: 12;
      }

      .workspace-topbar h2 {
        align-items: center;
        display: flex;
        font-size: 1.02rem;
        gap: 8px;
        line-height: 1.2;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar-workspace {
        color: var(--text-muted);
        font-size: 0.68rem;
        font-weight: 800;
        margin: 0 0 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .channel-title-icon {
        align-items: center;
        background: rgb(91 140 255 / 16%);
        border: 1px solid rgb(91 140 255 / 28%);
        border-radius: 8px;
        color: var(--accent-soft);
        display: inline-flex;
        font-size: 0.72rem;
        font-weight: 950;
        min-height: 24px;
        padding: 0 7px;
      }

      .eyebrow {
        color: var(--text-muted);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        margin: 0 0 3px;
        text-transform: uppercase;
      }

      .desktop-qr {
        align-items: center;
        display: flex;
        gap: 5px;
        margin-left: auto;
      }

      .desktop-qr__code {
        background: white;
        border-radius: 6px;
        padding: 2px;
        width: 34px;
      }

      .desktop-qr__code svg {
        display: block;
        width: 100%;
      }

      .desktop-qr__link {
        color: var(--text-muted);
        font-size: 0.64rem;
        text-decoration: none;
      }

      .voice-panel {
        background:
          radial-gradient(circle at 50% 0%, rgb(91 140 255 / 13%), transparent 28rem),
          linear-gradient(180deg, var(--stage) 0%, var(--stage-2) 100%);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: grid;
        gap: var(--density-gap);
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        min-height: 0;
        overflow: hidden;
        padding: var(--density-padding);
      }

      .app-shell[data-layout-mode="compact"] .voice-panel {
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .app-shell[data-layout-mode="compact"] .voice-video-grid {
        max-height: 34dvh;
      }

      .app-shell[data-layout-mode="compact"] .voice-video-grid__tile:not(.is-focused) {
        max-width: 240px;
      }

      .voice-panel__header,
      .chat-panel__header {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        min-width: 0;
      }

      .voice-panel__header h2,
      .chat-panel__header h2 {
        font-size: 0.9rem;
        line-height: 1.2;
        margin: 0;
      }

      .voice-panel__header-status {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: end;
      }

      .voice-panel__status,
      .status-pill,
      .voice-shortcuts {
        background: rgb(91 140 255 / 12%);
        border: 1px solid rgb(91 140 255 / 26%);
        border-radius: 999px;
        color: var(--accent-soft);
        font-size: 0.66rem;
        font-weight: 800;
        line-height: 1;
        padding: 5px 8px;
      }

      .voice-shortcuts {
        background: rgb(255 255 255 / 5%);
        color: var(--text-muted);
      }

      .voice-participant-stage {
        min-height: 0;
        overflow: auto;
      }

      .voice-stage-empty,
      .chat-empty {
        align-content: center;
        border: 1px dashed rgb(148 163 184 / 30%);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 5px;
        justify-items: center;
        min-height: 130px;
        padding: 14px;
        text-align: center;
      }

      .voice-stage-empty strong,
      .chat-empty strong {
        color: var(--text);
      }

      .voice-stage-empty__icon {
        align-items: center;
        background: rgb(79 140 255 / 18%);
        border-radius: 999px;
        color: var(--accent-soft);
        display: inline-flex;
        font-size: 1rem;
        height: 38px;
        justify-content: center;
        width: 38px;
      }

      .voice-participant-grid {
        display: grid;
        gap: var(--density-gap);
        grid-template-columns: repeat(auto-fit, minmax(var(--tile-min), 1fr));
      }

      .voice-participant-grid[data-participant-count="1"] {
        grid-template-columns: minmax(220px, 1fr);
      }

      .voice-participant-grid[data-participant-count="2"] {
        grid-template-columns: repeat(2, minmax(var(--tile-min), 1fr));
      }

      .voice-participant-grid[data-participant-count="3"],
      .voice-participant-grid[data-participant-count="4"] {
        grid-template-columns: repeat(2, minmax(var(--tile-min), 1fr));
      }

      .app-shell[data-layout-mode="compact"] .voice-participant-grid {
        align-content: start;
        grid-template-columns: 1fr;
      }

      .voice-participant-card {
        align-content: center;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 6%), rgb(255 255 255 / 3%)), var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: grid;
        gap: 4px;
        justify-items: center;
        min-height: calc(92px * var(--ui-multiplier));
        padding: var(--density-padding);
        text-align: center;
      }

      .app-shell[data-layout-mode="compact"] .voice-participant-card {
        align-items: center;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto auto;
        justify-items: start;
        min-height: 40px;
        padding: 6px 8px;
        text-align: left;
      }

      .app-shell[data-layout-mode="compact"] .voice-participant-card .participant-avatar {
        height: 26px;
        width: 26px;
      }

      .voice-participant-card .participant-avatar {
        box-shadow: 0 8px 24px rgb(0 0 0 / 22%);
        font-size: 0.82rem;
        height: 38px;
        width: 38px;
      }

      .voice-participant-card strong {
        font-size: 0.82rem;
        line-height: 1.15;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .participant-role-chip {
        color: var(--text-muted);
        font-size: 0.65rem;
        font-weight: 800;
      }

      .voice-participant-card.is-speaking {
        border-color: var(--success);
        box-shadow:
          0 0 0 2px rgb(47 184 122 / 18%),
          0 0 28px rgb(47 184 122 / 10%);
      }

      .voice-video-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(var(--tile-media-min), 1fr));
        min-height: 0;
        overflow: auto;
      }

      .voice-video-grid:empty {
        display: none;
      }

      .voice-video-grid__tile {
        aspect-ratio: 16 / 9;
        background: #05070a;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: #ffffff;
        min-width: 0;
        overflow: hidden;
        padding: 0;
        position: relative;
      }

      .voice-video-grid__tile.is-focused {
        grid-column: 1 / -1;
        max-height: 62dvh;
      }

      .app-shell[data-stage-mode="focus"] .voice-video-grid__tile.is-focused {
        min-height: min(70dvh, 720px);
      }

      .app-shell[data-stage-mode="focus"] .voice-video-grid__tile:not(.is-focused) {
        max-width: 180px;
      }

      .app-shell[data-stage-mode="fullscreen"] .voice-video-grid {
        height: 100dvh;
        padding: 8px;
      }

      .app-shell[data-stage-mode="fullscreen"] .voice-video-grid__tile {
        border-radius: 6px;
      }

      .voice-video-grid__tile video {
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .voice-video-grid__tile.is-screen-share video {
        background: #05070a;
        object-fit: contain;
      }

      .voice-video-grid__caption {
        background: rgb(5 7 10 / 76%);
        border-radius: 999px;
        bottom: 10px;
        font-size: 0.68rem;
        font-weight: 800;
        left: 10px;
        padding: 3px 8px;
        position: absolute;
      }

      .voice-video-grid__pin {
        background: rgb(5 7 10 / 70%);
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 999px;
        color: #ffffff;
        font-size: 0.62rem;
        font-weight: 850;
        padding: 3px 7px;
        position: absolute;
        right: 10px;
        top: 10px;
      }

      .voice-panel__actions {
        align-items: center;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 5%)), var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: center;
        justify-self: center;
        padding: 4px;
        box-shadow: 0 14px 36px rgb(0 0 0 / 20%);
      }

      .voice-control-button,
      .voice-panel__settings summary {
        align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        display: inline-flex;
        font-size: calc(0.84rem * var(--ui-multiplier));
        font-weight: 900;
        height: calc(38px * var(--ui-multiplier));
        justify-content: center;
        min-width: calc(38px * var(--ui-multiplier));
        padding: 0 10px;
      }

      .voice-control-button:hover,
      .voice-panel__settings summary:hover {
        background: var(--surface-3);
        border-color: rgb(79 140 255 / 48%);
        color: var(--text);
      }

      .voice-control-button.is-active {
        background: linear-gradient(135deg, var(--accent), #3dd6a3);
        border-color: var(--accent);
        box-shadow: 0 0 18px rgb(91 140 255 / 24%);
        color: #ffffff;
      }

      .voice-control-button:disabled {
        opacity: 0.48;
      }

      .voice-control-icon {
        fill: none;
        height: 19px;
        pointer-events: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
        width: 19px;
      }

      .voice-control-button--danger {
        background: var(--danger);
        border-color: var(--danger);
        box-shadow: 0 0 18px rgb(239 68 68 / 18%);
        color: #ffffff;
      }

      .voice-panel__settings {
        position: relative;
      }

      .voice-panel__media {
        background:
          linear-gradient(180deg, rgb(255 255 255 / 7%), rgb(255 255 255 / 3%)), var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        bottom: 42px;
        display: grid;
        gap: 7px;
        grid-template-columns: repeat(2, minmax(140px, 1fr));
        padding: 9px;
        position: absolute;
        right: 50%;
        transform: translateX(50%);
        width: min(500px, calc(100vw - 36px));
        z-index: 5;
        box-shadow: 0 18px 60px rgb(0 0 0 / 34%);
      }

      .voice-panel__field {
        color: var(--text-muted);
        display: grid;
        font-size: 0.66rem;
        font-weight: 800;
        gap: 4px;
      }

      .voice-panel__input {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        min-height: 32px;
        padding: 0 8px;
      }

      .voice-panel__input:disabled {
        opacity: 0.72;
      }

      .voice-panel__stats {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        display: grid;
        font-size: 0.66rem;
        font-weight: 800;
        gap: 4px;
        grid-column: 1 / -1;
        line-height: 1.35;
        padding: 7px 8px;
      }

      .voice-panel__stats output {
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.68rem;
        font-weight: 700;
      }

      .chat-column {
        background: var(--panel);
        border-left: 1px solid var(--border-light);
        color: var(--text-dark);
        min-height: 0;
        overflow: hidden;
        padding: 8px;
      }

      .app-shell[data-chat-visibility="hidden"] .chat-column {
        display: none;
      }

      .chat-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        height: 100%;
        min-height: 0;
      }

      .chat-panel__header {
        border-bottom: 1px solid var(--border-light);
        display: flex;
        gap: 8px;
        justify-content: space-between;
        padding-bottom: 7px;
      }

      .chat-panel__tools {
        align-items: flex-end;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .chat-notification-button {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--border-light));
        border-radius: 999px;
        color: var(--text-dark);
        cursor: pointer;
        font-size: 0.64rem;
        font-weight: 800;
        line-height: 1;
        padding: 5px 8px;
      }

      .chat-notification-button:hover {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }

      .chat-notification-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .chat-panel .eyebrow,
      .chat-panel .status-pill {
        color: var(--text-dark-muted);
      }

      .chat-panel .status-pill {
        background: var(--panel-2);
        border-color: var(--border-light);
      }

      .chat-messages {
        display: grid;
        align-content: start;
        gap: 6px;
        min-height: 0;
        overflow: auto;
        padding: 8px 1px;
      }

      .chat-message {
        align-items: end;
        display: grid;
        gap: 6px;
        grid-template-columns: 24px minmax(0, 1fr);
        max-width: 96%;
      }

      .chat-message:hover {
        background: transparent;
      }

      .chat-message--own {
        justify-self: start;
      }

      .chat-message--own .chat-message__avatar {
        grid-column: 1;
      }

      .chat-message--own .chat-message__bubble {
        background: color-mix(in srgb, var(--accent) 24%, var(--panel));
        border-color: color-mix(in srgb, var(--accent) 44%, var(--border-light));
        grid-column: 2;
        grid-row: 1;
      }

      .chat-message__avatar {
        align-items: center;
        background: var(--surface-3);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        color: var(--text);
        display: inline-flex;
        font-size: 0.66rem;
        font-weight: 900;
        height: 24px;
        justify-content: center;
        width: 24px;
      }

      .chat-message__bubble {
        background: linear-gradient(180deg, rgb(255 255 255 / 5%), transparent), var(--panel-2);
        border: 1px solid var(--border-light);
        border-radius: 12px 12px 12px 4px;
        padding: 6px 8px;
      }

      .chat-message--own .chat-message__bubble {
        border-radius: 12px 12px 12px 4px;
      }

      .chat-message__meta {
        color: var(--text-dark-muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.6rem;
        gap: 4px;
      }

      .chat-message__author {
        color: var(--text-dark);
        font-weight: 800;
      }

      .chat-message__body {
        font-size: 0.8rem;
        line-height: 1.28;
        margin: 2px 0 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .chat-emoji-set {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding-top: 4px;
      }

      .chat-emoji-button {
        align-items: center;
        background: var(--panel-2);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        color: var(--text-dark);
        display: inline-flex;
        font-size: 0.78rem;
        height: 24px;
        justify-content: center;
        min-width: 24px;
        padding: 0 6px;
      }

      .chat-emoji-button:hover,
      .chat-emoji-button:focus-visible {
        background: color-mix(in srgb, var(--accent) 18%, var(--panel-2));
        border-color: color-mix(in srgb, var(--accent) 40%, var(--border-light));
      }

      .chat-empty {
        color: var(--text-dark-muted);
        min-height: 140px;
      }

      .chat-empty strong {
        color: var(--text-dark);
      }

      .chat-composer {
        background: transparent;
        border-top: 1px solid var(--border-light);
        display: grid;
        gap: 4px;
        padding: 7px 0 0;
      }

      .chat-composer__label {
        height: 1px;
        margin: -1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      .chat-composer__field {
        position: relative;
      }

      .chat-composer__input {
        background: var(--panel);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        color: var(--text-dark);
        min-height: 32px;
        padding: 6px 42px 6px 11px;
        resize: none;
        width: 100%;
      }

      .chat-composer__status,
      .form-status {
        color: var(--text-dark-muted);
        font-size: 0.66rem;
        margin: 0;
        min-height: 12px;
      }

      .chat-composer__send {
        align-items: center;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        color: white;
        display: inline-flex;
        font-weight: 900;
        height: 26px;
        justify-content: center;
        position: absolute;
        right: 3px;
        top: 3px;
        width: 32px;
      }

      .audit-log {
        background: var(--subtle-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        display: grid;
        gap: 5px;
        max-height: 108px;
        overflow: auto;
        padding: 7px 9px;
      }

      .audit-log h2 {
        color: var(--text-muted);
        font-size: 0.66rem;
        letter-spacing: 0.04em;
        margin: 0;
        text-transform: uppercase;
      }

      .audit-log__empty {
        font-size: 0.68rem;
        margin: 0;
      }

      .audit-log__list {
        display: grid;
        gap: 6px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .audit-log__entry {
        border-top: 1px solid var(--border);
        display: grid;
        gap: 2px;
        padding-top: 6px;
      }

      .audit-log__line,
      .audit-log__meta {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .audit-log__line {
        color: var(--text);
        font-size: 0.72rem;
      }

      .audit-log__line code {
        color: var(--text-muted);
        font-size: 0.66rem;
      }

      .audit-log__meta {
        font-size: 0.66rem;
      }

      dialog {
        background: var(--panel);
        border: 1px solid var(--border-light);
        border-radius: 14px;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
        color: var(--text-dark);
        max-width: min(720px, calc(100vw - 32px));
        padding: 16px;
        width: 100%;
      }

      dialog:not([open]) {
        display: none;
      }

      dialog::backdrop {
        background: rgb(0 0 0 / 55%);
      }

      dialog .eyebrow,
      dialog .dialog-header p {
        color: var(--text-dark-muted);
      }

      dialog h2 {
        margin: 0;
      }

      .onboarding-tabs {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
        margin: 12px 0;
      }

      .onboarding-tab {
        background: var(--panel-2);
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        color: var(--text-dark);
        display: grid;
        gap: 4px;
        padding: 10px;
        text-align: left;
      }

      .onboarding-tab.is-active {
        background: rgb(79 140 255 / 18%);
        border-color: rgb(79 140 255 / 62%);
        box-shadow: inset 3px 0 0 var(--accent);
        color: var(--text-dark);
      }

      body[data-theme="light"] .onboarding-tab.is-active {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .onboarding-tab span {
        color: var(--text-dark-muted);
        font-size: 0.74rem;
      }

      .onboarding-form,
      .invite-result {
        display: grid;
        gap: 8px;
      }

      .onboarding-hint {
        color: var(--text-dark-muted);
        font-size: 0.72rem;
        line-height: 1.35;
        margin: 0;
      }

      .onboarding-form label,
      .invite-result label,
      .advanced-test-data label {
        display: grid;
        gap: 6px;
      }

      .onboarding-form label span,
      .invite-result label span,
      .advanced-test-data label span {
        color: var(--text-dark-muted);
        font-size: 0.68rem;
        font-weight: 800;
      }

      .onboarding-form input,
      .onboarding-form select,
      .invite-result input {
        background: var(--panel);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-sm);
        color: var(--text-dark);
        min-height: 34px;
        padding: 0 9px;
      }

      .advanced-test-data {
        background: var(--panel-2);
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        padding: 8px;
      }

      .advanced-test-data summary {
        color: var(--text-dark-muted);
        cursor: pointer;
        font-size: 0.76rem;
        font-weight: 800;
      }

      .onboarding-dialog.is-invite-keycloak .onboarding-tabs,
      .onboarding-dialog.is-invite-keycloak #onboarding-create-panel,
      .onboarding-dialog.is-invite-keycloak #workspace-join-form label,
      .onboarding-dialog.is-invite-keycloak #workspace-join-form button[type="submit"] {
        display: none;
      }

      .onboarding-dialog.is-invite-keycloak #onboarding-join-panel {
        display: block;
      }

      .onboarding-dialog.is-invite-keycloak .onboarding-keycloak-register {
        margin-top: 12px;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        box-shadow: var(--shadow-focus);
        outline: none;
      }

      [data-state="error"] {
        color: var(--danger);
      }

      [data-state="success"] {
        color: var(--success);
      }

      @media (max-width: 1100px) {
        .app-shell {
          grid-template-columns: minmax(220px, 250px) minmax(0, 1fr);
        }

        .workspace-topbar {
          grid-template-columns: minmax(180px, 1fr);
        }

        .topbar-center,
        .topbar-actions {
          justify-content: flex-start;
        }

        .chat-column {
          border-left: 0;
          border-top: 1px solid var(--border-light);
          grid-column: 2;
          max-height: 32dvh;
        }
      }

      @media (max-width: 760px) {
        body {
          overflow: auto;
        }

        .app-shell {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100dvh;
        }

        .channel-sidebar,
        .workspace-panel,
        .chat-column {
          max-height: none;
          overflow: visible;
        }

        .chat-column {
          grid-column: 1;
        }

        .workspace-topbar {
          border-radius: 12px;
          min-height: 0;
        }

        .mode-controls {
          justify-content: flex-start;
        }

        .mode-combo {
          width: 100%;
        }

        .voice-panel__actions {
          bottom: 6px;
          position: sticky;
        }

        .voice-panel__settings {
          position: static;
        }

        .onboarding-tabs,
        .voice-panel__media {
          grid-template-columns: 1fr;
        }

        .voice-panel__media {
          bottom: auto;
          margin-top: 8px;
          position: static;
          transform: none;
          width: 100%;
        }

        .desktop-qr {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
