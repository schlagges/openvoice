<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenVoice</title>
    <style>
      :root {
        --color-bg: #f5f6f4;
        --color-panel: #ffffff;
        --color-panel-muted: #fafaf7;
        --color-border: #d9ddd5;
        --color-border-strong: #c6ccbf;
        --color-text: #171a16;
        --color-muted: #626b5f;
        --color-subtle: #7a8376;
        --color-primary: #226352;
        --color-primary-strong: #194d40;
        --color-primary-soft: #e7f1ed;
        --color-success: #1f7a4f;
        --color-warning: #9a6500;
        --color-error: #b42318;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --radius: 8px;
        --shadow-focus: 0 0 0 3px rgb(34 99 82 / 18%);
        color: var(--color-text);
        background: var(--color-bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html,
      body,
      #app {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
      }

      .channel-sidebar {
        background: var(--color-panel);
        border-right: 1px solid var(--color-border);
        display: grid;
        grid-auto-rows: max-content;
        gap: var(--space-4);
        min-height: 0;
        overflow: auto;
        padding: var(--space-5);
      }

      .channel-sidebar h1 {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0;
        margin: 0;
      }

      .channel-tree__list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .channel-tree__list--nested {
        margin-top: 4px;
        padding-left: 16px;
      }

      .channel-tree__item {
        margin: 3px 0;
      }

      .channel-tree__label {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: var(--radius);
        color: inherit;
        cursor: pointer;
        display: flex;
        gap: 8px;
        min-height: 34px;
        padding: 0 8px;
        text-align: left;
        width: 100%;
      }

      .channel-tree__label:hover,
      .channel-tree__item.is-active > .channel-tree__label {
        background: var(--color-panel-muted);
      }

      .channel-tree__kind {
        color: var(--color-muted);
        font-size: 0.7rem;
        font-weight: 600;
        min-width: 56px;
      }

      .channel-tree__empty {
        background: var(--color-panel-muted);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        color: var(--color-muted);
        display: grid;
        gap: 4px;
        line-height: 1.35;
        margin: 0;
        padding: var(--space-3);
      }

      .channel-tree__empty strong {
        color: var(--color-text);
      }

      .ops-links,
      .desktop-qr,
      .channel-browser,
      .workspace-switcher,
      .workspace-panel {
        background: var(--color-bg);
      }

      .workspace-panel {
        display: grid;
        gap: var(--space-4);
        grid-template-rows: minmax(0, 1fr) auto auto;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        padding: var(--space-5);
      }

      .ops-links,
      .desktop-qr,
      .channel-browser,
      .workspace-switcher,
      .quick-start {
        border-top: 1px solid var(--color-border);
        display: grid;
        gap: 8px;
        margin-top: 0;
        padding-top: var(--space-4);
      }

      .ops-links h2,
      .desktop-qr h2,
      .channel-browser h2,
      .workspace-switcher h2,
      .quick-start h2 {
        font-size: 0.9rem;
        font-weight: 700;
        margin: 0;
      }

      .channel-browser header {
        display: grid;
        gap: 4px;
      }

      .channel-browser p {
        color: var(--color-muted);
        font-size: 0.8rem;
        line-height: 1.35;
        margin: 0;
      }

      .quick-start p {
        color: var(--color-muted);
        font-size: 0.84rem;
        line-height: 1.35;
        margin: 0;
      }

      .workspace-switcher header {
        align-items: start;
        display: flex;
        gap: var(--space-2);
        justify-content: space-between;
      }

      .workspace-switcher p {
        color: var(--color-muted);
        font-size: 0.8rem;
        line-height: 1.35;
        margin: 4px 0 0;
      }

      .workspace-switcher header button {
        background: var(--color-panel);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius);
        color: var(--color-primary);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        min-height: 32px;
        padding: 0 8px;
      }

      .workspace-switcher__list {
        display: grid;
        gap: 6px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .workspace-switcher__item {
        background: var(--color-panel-muted);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        color: var(--color-text);
        cursor: pointer;
        display: grid;
        font: inherit;
        gap: 2px;
        min-height: 44px;
        padding: 8px 10px;
        text-align: left;
        width: 100%;
      }

      .workspace-switcher__item small,
      .workspace-switcher__empty,
      .workspace-switcher__status {
        color: var(--color-muted);
        font-size: 0.78rem;
      }

      .workspace-switcher__item.is-active {
        background: var(--color-primary-soft);
        border-color: var(--color-primary);
      }

      .workspace-switcher__status[data-state="error"] {
        color: var(--color-error);
      }

      .workspace-switcher__status[data-state="success"] {
        color: var(--color-success);
      }

      .desktop-qr {
        grid-template-columns: minmax(0, 1fr) 92px;
        align-items: center;
      }

      .desktop-qr p {
        color: var(--color-muted);
        font-size: 0.84rem;
        line-height: 1.35;
        margin: 4px 0 0;
      }

      .desktop-qr__code {
        background: #ffffff;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        padding: 8px;
      }

      .desktop-qr__code svg {
        display: block;
        height: auto;
        width: 100%;
      }

      .desktop-qr__link {
        color: var(--color-muted);
        font-size: 0.75rem;
        grid-column: 1 / -1;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .quick-start__form {
        display: grid;
        gap: var(--space-2);
      }

      .quick-start__form label {
        display: grid;
        gap: 4px;
      }

      .quick-start__form span {
        color: var(--color-muted);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .quick-start__form input,
      .quick-start__form select {
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius);
        font: inherit;
        min-height: 36px;
        min-width: 0;
        padding: 0 10px;
      }

      .quick-start__form button {
        background: var(--color-primary);
        border: 0;
        border-radius: var(--radius);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        min-height: 40px;
        padding: 0 12px;
      }

      .quick-start__form button:hover {
        background: var(--color-primary-strong);
      }

      .quick-start__form button:disabled {
        background: var(--color-border-strong);
        cursor: not-allowed;
      }

      .quick-start__status {
        min-height: 18px;
      }

      .quick-start__status[data-state="error"] {
        color: var(--color-error);
      }

      .quick-start__status[data-state="success"] {
        color: var(--color-success);
      }

      .ops-links__grid {
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr 1fr;
      }

      .ops-links__grid a {
        background: var(--color-panel-muted);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        color: var(--color-primary);
        font-size: 0.82rem;
        font-weight: 600;
        min-width: 0;
        overflow-wrap: anywhere;
        padding: 8px;
        text-decoration: none;
      }

      .ops-links__grid a:hover,
      .ops-links__grid a:focus {
        background: var(--color-primary-soft);
        border-color: var(--color-primary);
        outline: none;
      }

      .ops-links__grid a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        box-shadow: var(--shadow-focus);
        outline: none;
      }

      .chat-panel {
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }

      .chat-panel__header,
      .voice-panel__header {
        align-items: center;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        gap: var(--space-3);
        justify-content: space-between;
        min-width: 0;
        padding: var(--space-4);
      }

      .chat-panel__header h2,
      .voice-panel__header h2 {
        font-size: 1.05rem;
        margin: 0;
      }

      .eyebrow {
        color: var(--color-muted);
        font-size: 0.76rem;
        font-weight: 700;
        margin: 0 0 2px;
      }

      .status-pill {
        background: var(--color-primary-soft);
        border: 1px solid rgb(34 99 82 / 20%);
        border-radius: 999px;
        color: var(--color-primary-strong);
        font-size: 0.78rem;
        font-weight: 700;
        padding: 4px 10px;
        white-space: nowrap;
      }

      .chat-messages {
        list-style: none;
        margin: 0;
        min-height: 0;
        overflow: auto;
        padding: var(--space-4) var(--space-5);
      }

      .chat-empty {
        align-content: center;
        color: var(--color-muted);
        display: grid;
        gap: var(--space-2);
        justify-items: center;
        min-height: 0;
        padding: var(--space-5);
        text-align: center;
      }

      .chat-empty strong {
        color: var(--color-text);
      }

      .chat-message {
        border-bottom: 1px solid var(--color-border);
        padding: 10px 0;
      }

      .chat-message__meta {
        align-items: center;
        color: var(--color-muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.8rem;
        gap: 8px;
      }

      .chat-message__author {
        color: var(--color-text);
        font-weight: 700;
      }

      .chat-message__body {
        margin: 6px 0 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .chat-message__edited {
        color: var(--color-subtle);
      }

      .chat-composer {
        background: var(--color-panel-muted);
        border-top: 1px solid var(--color-border);
        display: grid;
        gap: 8px;
        padding: var(--space-4);
      }

      .chat-composer__label {
        font-size: 0.8rem;
        font-weight: 600;
      }

      .chat-composer__input {
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius);
        font: inherit;
        min-height: 76px;
        padding: 10px;
        resize: vertical;
      }

      .chat-composer__status {
        color: var(--color-muted);
        font-size: 0.82rem;
        margin: 0;
        min-height: 18px;
      }

      .chat-composer__status[data-state="error"] {
        color: var(--color-error);
      }

      .chat-composer__status[data-state="success"] {
        color: var(--color-success);
      }

      .chat-composer__send {
        align-self: end;
        background: var(--color-primary);
        border: 0;
        border-radius: var(--radius);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        justify-self: end;
        min-height: 40px;
        padding: 0 16px;
      }

      .chat-composer__send:hover,
      .voice-panel__primary:hover {
        background: var(--color-primary-strong);
      }

      .chat-composer__send:disabled {
        background: var(--color-border-strong);
        cursor: not-allowed;
      }

      .voice-panel {
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        display: grid;
        gap: var(--space-4);
        max-height: 42dvh;
        min-height: 0;
        overflow: auto;
        padding: 0;
      }

      .voice-panel__field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .voice-panel__field span {
        color: var(--color-muted);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .voice-panel__input {
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius);
        font: inherit;
        min-height: 40px;
        min-width: 0;
        padding: 0 12px;
      }

      .voice-panel__join {
        display: grid;
        gap: var(--space-3);
        grid-template-columns: minmax(220px, 1fr) auto;
        padding: 0 var(--space-4);
      }

      .voice-panel__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 var(--space-4);
      }

      .voice-panel__actions button {
        background: var(--color-panel);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius);
        color: var(--color-text);
        font: inherit;
        min-height: 40px;
        padding: 0 12px;
      }

      .voice-panel__actions button:hover {
        background: var(--color-panel-muted);
        border-color: var(--color-primary);
      }

      .voice-panel__actions button:disabled {
        background: var(--color-panel-muted);
        border-color: var(--color-border);
        color: var(--color-subtle);
        cursor: not-allowed;
      }

      .voice-panel__primary {
        align-self: end;
        background: var(--color-primary);
        border: 0;
        border-radius: var(--radius);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        min-height: 40px;
        padding: 0 16px;
        white-space: nowrap;
      }

      .voice-panel__media {
        display: grid;
        gap: var(--space-3);
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        padding: 0 var(--space-4);
      }

      .voice-video-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        min-height: 0;
        padding: 0 var(--space-4) var(--space-4);
      }

      .voice-video-grid__tile {
        aspect-ratio: 16 / 9;
        background: #151513;
        border: 1px solid #2a302d;
        border-radius: var(--radius);
        color: #ffffff;
        min-width: 0;
        overflow: hidden;
        padding: 0;
        position: relative;
      }

      .voice-video-grid__tile.is-focused {
        grid-column: 1 / -1;
        max-height: min(38dvh, 520px);
      }

      .voice-video-grid__tile video {
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .voice-video-grid__caption {
        background: rgb(21 21 19 / 72%);
        bottom: 0;
        font-size: 0.78rem;
        left: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        padding: 4px 7px;
        position: absolute;
      }

      .voice-panel__status {
        background: var(--color-panel-muted);
        border: 1px solid var(--color-border);
        border-radius: 999px;
        color: var(--color-muted);
        font-size: 0.82rem;
        min-height: 0;
        padding: 4px 10px;
      }

      .audit-log {
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        display: grid;
        gap: 10px;
        max-height: 22dvh;
        min-height: 0;
        overflow: auto;
        padding: var(--space-4);
      }

      .audit-log h2 {
        font-size: 0.95rem;
        margin: 0;
      }

      .audit-log__empty {
        color: var(--color-muted);
        margin: 0;
      }

      .audit-log__list {
        display: grid;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .audit-log__entry {
        border-bottom: 1px solid var(--color-border);
        display: grid;
        gap: 4px;
        padding: 0 0 8px;
      }

      .audit-log__line,
      .audit-log__meta {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .audit-log__line code {
        overflow-wrap: anywhere;
      }

      .audit-log__meta {
        color: var(--color-muted);
        font-size: 0.8rem;
      }

      @media (max-width: 720px) {
        .app-shell {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
        }

        .channel-sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--color-border);
          max-height: 38dvh;
          padding: var(--space-4);
        }

        .desktop-qr {
          display: none;
        }

        .workspace-panel {
          gap: var(--space-3);
          padding: var(--space-3);
        }

        .chat-panel {
          min-height: 0;
        }

        .voice-panel__join {
          grid-template-columns: 1fr;
        }

        .voice-panel__primary,
        .chat-composer__send {
          justify-self: stretch;
        }

        .voice-panel {
          max-height: 48dvh;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
