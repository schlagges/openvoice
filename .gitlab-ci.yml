stages:
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  VITE_API_BASE_URL: "/api/v1"

build_images:
  stage: build
  tags:
    - ki-maschine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --pull --target api -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/api:latest" .
    - docker build --pull --target web --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/web:latest" .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"

deploy_prod:
  stage: deploy
  tags:
    - ki-maschine
  needs:
    - build_images
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - cd /home/schlagges/projects/openvoice/infra
    - docker compose pull api web
    - docker compose up -d api web
    - docker image prune -f
