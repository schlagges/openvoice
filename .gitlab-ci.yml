stages:
  - validate
  - test
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-home"
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"
  VITE_API_BASE_URL: "/api/v1"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/
    - .pnpm-home/

.node_job:
  image: node:22-bookworm
  tags:
    - ki-maschine
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

format:
  extends: .node_job
  stage: validate
  script:
    - pnpm format:check

lint:
  extends: .node_job
  stage: validate
  script:
    - pnpm lint

license:
  extends: .node_job
  stage: validate
  script:
    - pnpm license:check

unit_tests:
  extends: .node_job
  stage: test
  script:
    - pnpm test

build_app:
  extends: .node_job
  stage: build
  script:
    - pnpm build

build_images:
  stage: build
  image: docker:27-cli
  tags:
    - ki-maschine
  needs:
    - build_app
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull --target api -t "$CI_REGISTRY_IMAGE:api-$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:api-latest" .
    - docker build --pull --target web --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" -t "$CI_REGISTRY_IMAGE:web-$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:web-latest" .
    - docker push "$CI_REGISTRY_IMAGE:api-$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:api-latest"
    - docker push "$CI_REGISTRY_IMAGE:web-$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:web-latest"

deploy_prod:
  stage: deploy
  image: docker:27-cli
  tags:
    - ki-maschine
  needs:
    - build_images
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - cd /home/schlagges/projects/openvoice/infra
    - export OPENVOICE_API_IMAGE="$CI_REGISTRY_IMAGE:api-$CI_COMMIT_SHA"
    - export OPENVOICE_WEB_IMAGE="$CI_REGISTRY_IMAGE:web-$CI_COMMIT_SHA"
    - docker compose pull api web
    - docker compose up -d api web
    - docker image prune -f
