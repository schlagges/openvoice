# coturn example config for OpenVoice
# Replace placeholders before production use.

listening-port=3478
tls-listening-port=5349

realm=voice.example.com
server-name=voice.example.com
fingerprint

# Auth: no anonymous TURN access.
lt-cred-mech
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SHARED_SECRET

# TLS certs.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Relay ports.
min-port=49152
max-port=65535

# If the server is behind NAT, configure this.
# external-ip=PUBLIC_IP/PRIVATE_IP

# Security: avoid relaying to local/private/multicast targets where appropriate.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-239.255.255.255

# Quotas.
user-quota=24
total-quota=12000
max-bps=0

# Monitoring.
prometheus
prometheus-port=9641

# Logging.
log-file=stdout
simple-log
new-log-timestamp
