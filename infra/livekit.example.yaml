# LiveKit example config for OpenVoice.
# Replace keys/secrets before production use.

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

keys:
  CHANGE_ME_LIVEKIT_API_KEY: CHANGE_ME_LIVEKIT_API_SECRET

logging:
  level: info

turn:
  enabled: false

room:
  auto_create: true
