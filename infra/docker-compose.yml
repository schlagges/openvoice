services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      livekit:
        condition: service_started
      coturn:
        condition: service_started
    environment:
      API_PORT: 3000
      CSRF_SECRET: ${CSRF_SECRET:-replace-with-generated-csrf-secret}
      DATABASE_URL: postgres://${POSTGRES_USER:-openvoice}:${POSTGRES_PASSWORD:-openvoice_dev_password}@postgres:5432/${POSTGRES_DB:-openvoice}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-livekit-api-secret-32chars}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-600}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      MEDIA_PROVIDER: livekit
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-replace-with-generated-password-pepper}
      REDIS_URL: redis://valkey:6379
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-openvoice_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-generated-session-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      TURN_REALM: ${TURN_REALM:-localhost}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-replace-with-generated-turn-shared-secret}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-1200}
      TURN_URL: ${TURN_URL:-localhost}
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      target: web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openvoice}
      POSTGRES_USER: ${POSTGRES_USER:-openvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvoice_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${VALKEY_PORT:-6379}:6379"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORTS:-50000-50100}:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  coturn:
    image: coturn/coturn:latest
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=${TURN_REALM:-localhost}
      - --server-name=${TURN_REALM:-localhost}
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-replace-with-generated-turn-shared-secret}
      - --min-port=49152
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --prometheus
      - --prometheus-port=9641
      - --log-file=stdout
      - --simple-log
    ports:
      - "${TURN_PORT:-3478}:3478"
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURNS_PORT:-5349}:5349"
      - "${TURNS_PORT:-5349}:5349/udp"
      - "${TURN_RELAY_PORTS:-49152-49200}:49152-49200/udp"

volumes:
  postgres_data:
