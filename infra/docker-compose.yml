services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      API_PORT: 3000
      CSRF_SECRET: ${CSRF_SECRET:-replace-with-generated-csrf-secret}
      DATABASE_URL: postgres://${POSTGRES_USER:-openvoice}:${POSTGRES_PASSWORD:-openvoice_dev_password}@postgres:5432/${POSTGRES_DB:-openvoice}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-replace-with-generated-password-pepper}
      REDIS_URL: redis://valkey:6379
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-openvoice_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-generated-session-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openvoice}
      POSTGRES_USER: ${POSTGRES_USER:-openvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvoice_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${VALKEY_PORT:-6379}:6379"

volumes:
  postgres_data:
