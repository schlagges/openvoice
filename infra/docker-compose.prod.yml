services:
  api:
    image: ${OPENVOICE_API_IMAGE:?OPENVOICE_API_IMAGE is required}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      livekit:
        condition: service_started
      coturn:
        condition: service_started
    environment:
      API_PORT: 3000
      AUDIT_IP_HASH_SECRET: ${AUDIT_IP_HASH_SECRET:?AUDIT_IP_HASH_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-600}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      MEDIA_PROVIDER: livekit
      LOCAL_PASSWORD_AUTH_ENABLED: ${LOCAL_PASSWORD_AUTH_ENABLED:-false}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-openvoice}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:?OIDC_CALLBACK_URL is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-openvoice}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_REQUIRED_CLIENT_ROLE: ${OIDC_REQUIRED_CLIENT_ROLE:-user}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      REDIS_URL: redis://valkey:6379
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-openvoice_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      TURN_REALM: ${TURN_REALM:?TURN_REALM is required}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-1200}
      TURN_URL: ${TURN_URL:?TURN_URL is required}
      TURNS_PORT: ${TURNS_PORT:-5349}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    ports:
      - "${API_PORT:-127.0.0.1:3002}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${OPENVOICE_WEB_IMAGE:?OPENVOICE_WEB_IMAGE is required}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-127.0.0.1:3000}:80"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openvoice}
      POSTGRES_USER: ${POSTGRES_USER:-openvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:55436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${VALKEY_PORT:-127.0.0.1:6379}:6379"

  livekit:
    image: livekit/livekit-server:latest
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat > /tmp/livekit.yaml <<EOF
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END:-51000}
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        prometheus:
          port: 6789
        keys:
          $${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}
        logging:
          level: info
        turn:
          enabled: false
        room:
          auto_create: true
        EOF
        exec /livekit-server --config /tmp/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
    ports:
      - "${LIVEKIT_PORT:-127.0.0.1:7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORTS:-50000-51000}:${LIVEKIT_RTC_UDP_PORTS:-50000-51000}/udp"
      - "${LIVEKIT_METRICS_PORT:-127.0.0.1:6789}:6789"

  coturn:
    image: coturn/coturn:latest
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --server-name=${TURN_REALM:?TURN_REALM is required}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --cert=${TURN_CERT_FILE:?TURN_CERT_FILE is required}
      - --pkey=${TURN_PRIVATE_KEY_FILE:?TURN_PRIVATE_KEY_FILE is required}
      - --min-port=${TURN_MIN_PORT:-49152}
      - --max-port=${TURN_MAX_PORT:-49999}
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=224.0.0.0-239.255.255.255
      - --prometheus
      - --prometheus-port=9641
      - --log-file=stdout
      - --simple-log
    ports:
      - "${TURN_PORT:-3478}:3478"
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURNS_PORT:-5349}:5349"
      - "${TURNS_PORT:-5349}:5349/udp"
      - "${TURN_RELAY_PORTS:-49152-49999}:${TURN_RELAY_PORTS:-49152-49999}/udp"
      - "${TURN_METRICS_PORT:-127.0.0.1:9641}:9641"
    volumes:
      - ${TURN_CERT_MOUNT:?TURN_CERT_MOUNT is required}

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      api:
        condition: service_healthy
      coturn:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-127.0.0.1:9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-127.0.0.1:3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  grafana_data:
  postgres_data:
  prometheus_data:
