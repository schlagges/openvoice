# LiveKit config reference for OpenVoice.
# Docker Compose generates its runtime LiveKit config from LIVEKIT_API_KEY and
# LIVEKIT_API_SECRET. Do not commit concrete LiveKit keys or secrets here.

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

keys: {}

logging:
  level: info

turn:
  enabled: false

room:
  auto_create: true
