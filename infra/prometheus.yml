global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: openvoice-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000

  - job_name: coturn
    metrics_path: /metrics
    static_configs:
      - targets:
          - coturn:9641
